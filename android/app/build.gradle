plugins { id 'com.android.application' }
android {
    namespace 'com.avanza.vendedores'
    compileSdk 35
    defaultConfig { applicationId 'com.avanza.vendedores'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('AVANZA_KEYSTORE')) {
                storeFile file(System.getenv('AVANZA_KEYSTORE'))
                storePassword System.getenv('AVANZA_STORE_PASSWORD')
                keyAlias 'avanza'
                keyPassword System.getenv('AVANZA_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
